# Test pages for URL previews: a directory per host under sites/, and the images the seed
# makes (in a volume) under /img/ on every host.
server {
    listen 80 default_server;
    root /usr/share/nginx/html/$host;

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    location /img/ {
        root /srv;
    }
}
